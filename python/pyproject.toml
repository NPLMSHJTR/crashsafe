[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "crashsafe"
version = "0.1.0"
description = "Verify that a log-structured key-value store recovers to the longest valid prefix after any truncation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "crashsafe contributors" }]
keywords = ["crash-consistency", "storage", "wal", "fault-injection", "testing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Java",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.scripts]
crashsafe = "crashsafe.cli:main"

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/crashsafe"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
